steps:
  - label: "CUDA Julia 1"
    key: "tests-cuda"
    if: build.message !~ /\[skip tests\]/
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
            - ext
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; coverage=true, test_args=["--backend=CUDA"])'
    agents:
      queue: "cuda"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4

  - label: "AMDGPU Julia 1"
    key: "tests-amdgpu"
    if: build.message !~ /\[skip tests\]/
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
            - ext
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; coverage=true, test_args=["--backend=AMDGPU"])'
    agents:
      queue: "rocm"
      rocmgpu: "*"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4

  - label: "Metal Julia 1"
    key: "tests-metal"
    if: build.message !~ /\[skip tests\]/
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
            - ext
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.instantiate()' || exit 3

      julia --project=. -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test(; coverage=true, test_args=["--backend=Metal"])'
    agents:
      queue: "metal"
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3
    env:
      JULIA_NUM_THREADS: 4

